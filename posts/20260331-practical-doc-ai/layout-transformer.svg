<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#fffdf7"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c735f"/>
    </marker>
  </defs>

  <style>
    .box { fill: #fbf7ec; stroke: #c7baa0; stroke-width: 2; rx: 18; }
    .accent { fill: #f2ead6; }
    .model { fill: #f9f0da; stroke: #c59a42; stroke-width: 2.5; rx: 22; }
    .chip { fill: #fbf7ec; stroke: #c7baa0; stroke-width: 1.5; rx: 8; }
    .chiphit { fill: #f3c9a8; stroke: #b0602d; stroke-width: 2; rx: 8; }
    .text { font-family: Verdana, sans-serif; fill: #312814; font-size: 17px; }
    .small { font-size: 14px; fill: #5b5547; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #312814; }
    .arrow { stroke: #7c735f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .note { font-family: Verdana, sans-serif; font-size: 13px; fill: #8a4a1f; }
  </style>

  <text x="600" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2f2b23">
    Layout-aware transformer: one model, three cues
  </text>

  <!-- inputs -->
  <rect class="box" x="40" y="110" width="240" height="72"/>
  <text class="text" x="160" y="141" text-anchor="middle">Image patches</text>
  <text class="small" x="160" y="163" text-anchor="middle">page pixels, gridded</text>

  <rect class="box" x="40" y="222" width="240" height="72"/>
  <text class="text" x="160" y="253" text-anchor="middle">OCR text tokens</text>
  <text class="small" x="160" y="275" text-anchor="middle">words in reading order</text>

  <rect class="box" x="40" y="334" width="240" height="72"/>
  <text class="text" x="160" y="365" text-anchor="middle">2D layout</text>
  <text class="small" x="160" y="387" text-anchor="middle">bounding box per token</text>

  <!-- arrows into model -->
  <path class="arrow" d="M 280 146 L 388 146"/>
  <path class="arrow" d="M 280 258 L 388 258"/>
  <path class="arrow" d="M 280 370 L 388 370"/>

  <!-- model -->
  <rect class="model" x="390" y="110" width="310" height="296"/>
  <text class="text" x="545" y="170" text-anchor="middle" font-size="20">Transformer encoder</text>
  <text class="small" x="545" y="206" text-anchor="middle">text, 1D position, 2D layout, and</text>
  <text class="small" x="545" y="226" text-anchor="middle">patch embeddings, jointly attended</text>
  <text class="small" x="545" y="290" text-anchor="middle">a token means something different</text>
  <text class="small" x="545" y="310" text-anchor="middle">depending on where it sits and</text>
  <text class="small" x="545" y="330" text-anchor="middle">what surrounds it</text>

  <!-- arrow to output -->
  <path class="arrow" d="M 700 258 L 788 258"/>

  <!-- output -->
  <rect class="box accent" x="790" y="200" width="370" height="116"/>
  <text class="text" x="975" y="235" text-anchor="middle">Token classification</text>
  <text class="small" x="975" y="260" text-anchor="middle">for each OCR token: is it part of the</text>
  <text class="small" x="975" y="280" text-anchor="middle">answer to the question being asked?</text>

  <!-- worked example strip -->
  <text class="small" x="790" y="368">Question: gross pay</text>

  <rect class="chip" x="790" y="382" width="88" height="34"/>
  <text class="mono" x="834" y="404" text-anchor="middle">Employee</text>

  <rect class="chip" x="886" y="382" width="52" height="34"/>
  <text class="mono" x="912" y="404" text-anchor="middle">Jane</text>

  <rect class="chip" x="946" y="382" width="44" height="34"/>
  <text class="mono" x="968" y="404" text-anchor="middle">Doe</text>

  <rect class="chip" x="790" y="426" width="58" height="34"/>
  <text class="mono" x="819" y="448" text-anchor="middle">Gross</text>

  <rect class="chip" x="856" y="426" width="44" height="34"/>
  <text class="mono" x="878" y="448" text-anchor="middle">Pay</text>

  <rect class="chiphit" x="908" y="426" width="96" height="34"/>
  <text class="mono" x="956" y="448" text-anchor="middle">4,250.00</text>

  <text class="note" x="1014" y="448">answer tokens</text>

  <!-- supervision note -->
  <text class="note" x="545" y="436" text-anchor="middle">Supervision: label only the final answer,</text>
  <text class="note" x="545" y="456" text-anchor="middle">then project it back onto token labels.</text>
  <text class="note" x="545" y="476" text-anchor="middle">No hand-drawn field boxes needed.</text>
</svg>
