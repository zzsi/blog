<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 760 612" role="img" aria-label="Which layer to work on" font-size="12.5"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#999999"/></marker></defs><rect x="0" y="0" width="760" height="612" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#222222">Which layer to work on</text><g fill="none" stroke="#999999" stroke-width="1.25" marker-end="url(#arr)"><path d="M240 116V148"/><path d="M240 222V254"/><path d="M240 312V344"/><path d="M240 402V434"/><path d="M240 492V524"/><path d="M440 88H498"/><path d="M440 284H498"/><path d="M440 374H498"/><path d="M440 464H498"/></g><g font-size="11" fill="#666666"><text x="248" y="137">Yes</text><text x="248" y="333">Yes</text><text x="248" y="423">Yes</text><text x="248" y="513">Yes</text><text x="459" y="82">No</text><text x="459" y="278">No</text><text x="459" y="368">No</text><text x="459" y="458">No</text></g><g fill="#ffffff" stroke="#999999" stroke-width="1"><rect x="40" y="60" width="400" height="56" rx="6"/><rect x="40" y="256" width="400" height="56" rx="6"/><rect x="40" y="346" width="400" height="56" rx="6"/><rect x="40" y="436" width="400" height="56" rx="6"/></g><g text-anchor="middle" fill="#222222"><text x="240" y="84">Should the agent run part of a process on its own,</text><text x="240" y="102">or do your security needs rule out off-the-shelf agents?</text><text x="240" y="280">Have harness changes stopped moving your eval,</text><text x="240" y="298">and have you checked that the eval is right?</text><text x="240" y="370">Do frontier APIs still fail your task, cost too much</text><text x="240" y="388">at your volume, or need data that cannot leave?</text><text x="240" y="460">Do you have a training signal: examples,</text><text x="240" y="478">a stronger model, or a verifier?</text></g><g fill="#2b6cb0" fill-opacity="0.08" stroke="#2b6cb0" stroke-width="1.25"><rect x="500" y="52" width="236" height="72" rx="6"/><rect x="40" y="150" width="400" height="72" rx="6"/><rect x="500" y="428" width="236" height="72" rx="6"/><rect x="40" y="526" width="400" height="64" rx="6"/></g><g fill="#f5f5f5" stroke="#cccccc" stroke-width="1"><rect x="500" y="256" width="236" height="56" rx="6"/><rect x="500" y="346" width="236" height="56" rx="6"/></g><g text-anchor="middle"><text x="618" y="76" font-weight="600" fill="#222222">Layer 1 · off-the-shelf agent</text><text x="618" y="95" font-size="11.5" fill="#666666">Connect it to your data and tools,</text><text x="618" y="111" font-size="11.5" fill="#666666">and redesign the work around it.</text><text x="240" y="174" font-weight="600" fill="#222222">Layer 2 · build your own agent</text><text x="240" y="194" font-size="11.5" fill="#666666">Widen what it does on its own as the escalation queue</text><text x="240" y="210" font-size="11.5" fill="#666666">shows where it is reliable and someone answers for it.</text><text x="618" y="280" font-size="11.5" fill="#666666">Keep improving the harness,</text><text x="618" y="296" font-size="11.5" fill="#666666">or fix the eval first.</text><text x="618" y="370" font-size="11.5" fill="#666666">Stay at layer 2 and wait</text><text x="618" y="386" font-size="11.5" fill="#666666">for the next frontier release.</text><text x="618" y="452" font-weight="600" fill="#222222">Layer 3 · host open weights</text><text x="618" y="471" font-size="11.5" fill="#666666">Helps with cost or data,</text><text x="618" y="487" font-size="11.5" fill="#666666">not with a task the frontier fails.</text><text x="240" y="552" font-weight="600" fill="#222222">Layer 3 · train your own model</text><text x="240" y="572" font-size="11.5" fill="#666666">Try open weights as they are, then fine-tune, run RL or distill.</text></g></svg>
