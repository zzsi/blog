<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 760 284" role="img" aria-label="Layer 1: what you configure around an off-the-shelf agent" font-size="13"><rect x="0" y="0" width="760" height="284" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#222222">Layer 1: what you configure around an off-the-shelf agent</text><g fill="none" stroke="#e3e3e3" stroke-width="1.25"><circle cx="130" cy="160" r="100"></circle><circle cx="130" cy="160" r="66"></circle><circle cx="130" cy="160" r="32"></circle></g><g><path d="M30 160a100 100 0 1 0 200 0a100 100 0 1 0 -200 0Z M64 160a66 66 0 1 0 132 0a66 66 0 1 0 -132 0Z" fill-rule="evenodd" fill="#2b6cb0" fill-opacity="0.18" stroke="#2b6cb0" stroke-width="2"></path><text x="130" y="81" text-anchor="middle" font-size="11.5" font-weight="600" fill="#222222">Layer 1</text></g><g fill="none" stroke="#999999" stroke-width="1"><path d="M213 160H256M256 70V262"></path></g><g><text x="280" y="84" font-weight="600" fill="#222222">Integrations (MCP)</text><text x="280" y="102" font-size="11.5" fill="#666666">MCP servers that connect the agent to your systems</text></g><g><text x="280" y="136" font-weight="600" fill="#222222">Instruction files and skills</text><text x="280" y="154" font-size="11.5" fill="#666666">Standing context the agent reads, retested when models change</text></g><g><text x="280" y="188" font-weight="600" fill="#222222">Review and governance</text><text x="280" y="206" font-size="11.5" fill="#666666">How its output is reviewed, what it may touch and spend</text></g><g><text x="280" y="240" font-weight="600" fill="#222222">Adoption and change management</text><text x="280" y="258" font-size="11.5" fill="#666666">How people use it, and redesigning the work around it</text></g></svg>
