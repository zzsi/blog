<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 760 334" role="img" aria-label="Layer 2: the harness you build and run" font-size="13"><rect x="0" y="0" width="760" height="334" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#222222">Layer 2: the harness you build and run</text><g fill="none" stroke="#e3e3e3" stroke-width="1.25"><circle cx="130" cy="185" r="100"></circle><circle cx="130" cy="185" r="66"></circle><circle cx="130" cy="185" r="32"></circle></g><g><path d="M64 185a66 66 0 1 0 132 0a66 66 0 1 0 -132 0Z M98 185a32 32 0 1 0 64 0a32 32 0 1 0 -64 0Z" fill-rule="evenodd" fill="#2b6cb0" fill-opacity="0.18" stroke="#2b6cb0" stroke-width="2"></path><text x="130" y="140" text-anchor="middle" font-size="11.5" font-weight="600" fill="#222222">Layer 2</text></g><g fill="none" stroke="#999999" stroke-width="1"><path d="M179 185H256M256 70V312"></path></g><g><text x="280" y="84" font-weight="600" fill="#222222">Context engineering: what the model sees</text><text x="280" y="102" font-size="11.5" fill="#666666">Context assembled for each step</text></g><g><text x="280" y="134" font-weight="600" fill="#222222">Tools and access: what the agent can reach, and as whom</text><text x="280" y="152" font-size="11.5" fill="#666666">A small set of tools, credentials scoped to each run, a sandbox</text></g><g><text x="280" y="184" font-weight="600" fill="#222222">Orchestration: what happens between model calls</text><text x="280" y="202" font-size="11.5" fill="#666666">Fixed steps, automatic checks, escalation to a person</text></g><g><text x="280" y="234" font-weight="600" fill="#222222">Model routing: which model handles each step</text><text x="280" y="252" font-size="11.5" fill="#666666">Cheap models for routine steps, strong ones for hard ones</text></g><g><text x="280" y="284" font-weight="600" fill="#222222">Evals: how you know it works</text><text x="280" y="302" font-size="11.5" fill="#666666">Tests and graders built from your own tasks</text></g></svg>
