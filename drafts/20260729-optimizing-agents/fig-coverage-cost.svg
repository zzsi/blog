<rect x="246" y="51" width="12" height="12" fill="#f58518"/><text x="264" y="61" fill="#222">$300 an error</text>
<rect x="396" y="51" width="12" height="12" fill="#c0392b"/><text x="414" y="61" fill="#222">$3,000 an error</text>
