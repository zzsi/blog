<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" role="img" aria-label="Cost per form against coverage at three error costs">
<rect width="640" height="420" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="600" fill="#222">The best setting moves as errors get more expensive</text>
<text x="20" y="44" font-size="12" fill="#666">Cost per form against coverage; the large dot marks the cheapest setting</text>
<defs><clipPath id="plot"><rect x="80" y="70" width="520" height="290"/></clipPath></defs>
<line x1="80" x2="600" y1="360.0" y2="360.0" stroke="#eee"/><text x="72" y="364.0" text-anchor="end" fill="#666">$0</text>
<line x1="80" x2="600" y1="311.6666666666667" y2="311.6666666666667" stroke="#eee"/><text x="72" y="315.6666666666667" text-anchor="end" fill="#666">$5</text>
<line x1="80" x2="600" y1="263.33333333333337" y2="263.33333333333337" stroke="#eee"/><text x="72" y="267.33333333333337" text-anchor="end" fill="#666">$10</text>
<line x1="80" x2="600" y1="215.0" y2="215.0" stroke="#eee"/><text x="72" y="219.0" text-anchor="end" fill="#666">$15</text>
<line x1="80" x2="600" y1="166.66666666666669" y2="166.66666666666669" stroke="#eee"/><text x="72" y="170.66666666666669" text-anchor="end" fill="#666">$20</text>
<line x1="80" x2="600" y1="118.33333333333331" y2="118.33333333333331" stroke="#eee"/><text x="72" y="122.33333333333331" text-anchor="end" fill="#666">$25</text>
<line x1="80" x2="600" y1="70.0" y2="70.0" stroke="#eee"/><text x="72" y="74.0" text-anchor="end" fill="#666">$30</text>
<text x="80.0" y="378" text-anchor="middle" fill="#666">0%</text>
<text x="184.0" y="378" text-anchor="middle" fill="#666">20%</text>
<text x="288.0" y="378" text-anchor="middle" fill="#666">40%</text>
<text x="392.0" y="378" text-anchor="middle" fill="#666">60%</text>
<text x="496.0" y="378" text-anchor="middle" fill="#666">80%</text>
<text x="600.0" y="378" text-anchor="middle" fill="#666">100%</text>
<text x="340" y="400" text-anchor="middle" fill="#444">Coverage: share of forms the agent handles alone</text>
<line x1="80" x2="600" y1="215.0" y2="215.0" stroke="#444" stroke-dasharray="5 4"/><text x="596" y="209.0" text-anchor="end" fill="#444">By hand: $15</text>
<g clip-path="url(#plot)">
<polyline fill="none" stroke="#4c78a8" stroke-width="2.2" points="80.0,241.1 132.0,252.6 236.0,275.2 340.0,296.9 548.0,319.4 600.0,316.5"/>
