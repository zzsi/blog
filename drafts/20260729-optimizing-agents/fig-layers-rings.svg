<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 760 444" role="img" aria-label="Each layer you own takes you closer to the model" font-size="13"><rect x="0" y="0" width="760" height="444" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#222222">Each layer you own takes you closer to the model</text><g><circle cx="200" cy="250" r="170" fill="#2b6cb0" fill-opacity="0.08" stroke="#2b6cb0" stroke-width="1.25"></circle><text x="200" y="116" text-anchor="middle" font-weight="600" fill="#222222">Integration and adoption</text></g><g><circle cx="200" cy="250" r="112" fill="#2b6cb0" fill-opacity="0.08" stroke="#2b6cb0" stroke-width="1.25"></circle><text x="200" y="164" text-anchor="middle" font-weight="600" fill="#222222">Harness</text></g><g><circle cx="200" cy="250" r="54" fill="#2b6cb0" fill-opacity="0.08" stroke="#2b6cb0" stroke-width="1.25"></circle><text x="200" y="254" text-anchor="middle" font-weight="600" fill="#222222">Model</text></g><g fill="none" stroke="#999999" stroke-width="1"><path d="M297 112L410 92"></path><path d="M234 160L410 196"></path><path d="M228 250L410 300"></path></g><g><text x="420" y="96" font-weight="600" fill="#222222">Layer 1 · integration and adoption</text><text x="420" y="116" font-size="11.5" fill="#666666">You own the outer ring: your data and tools,</text><text x="420" y="132" font-size="11.5" fill="#666666">instruction files, permissions, and the people</text><text x="420" y="148" font-size="11.5" fill="#666666">and process around it. You shape the agent</text><text x="420" y="164" font-size="11.5" fill="#666666">only through what the product exposes.</text></g><g><text x="420" y="200" font-weight="600" fill="#222222">Layer 2 · harness engineering</text><text x="420" y="220" font-size="11.5" fill="#666666">You also own the middle ring: what the model</text><text x="420" y="236" font-size="11.5" fill="#666666">sees, its tools and what they can access,</text><text x="420" y="252" font-size="11.5" fill="#666666">what happens between calls, which model</text><text x="420" y="268" font-size="11.5" fill="#666666">handles each step, and how you test it.</text></g><g><text x="420" y="304" font-weight="600" fill="#222222">Layer 3 · model engineering</text><text x="420" y="324" font-size="11.5" fill="#666666">You also own the core: you run the model's</text><text x="420" y="340" font-size="11.5" fill="#666666">weights yourself, and often train them.</text></g></svg>
